[project]
name = "hesper"
version = "0.7.0"
description = "Local meeting recorder, transcriber and note-taker for macOS and Windows"
requires-python = ">=3.12"
dependencies = [
    # Mac: MLX (Apple silicon). Other PCs: faster-whisper, and llama.cpp's server for the notes
    # (a separate program, see llama_server.py).
    "mlx-lm>=0.32.2; sys_platform == 'darwin'",
    "mlx-whisper>=0.4.3; sys_platform == 'darwin'",
    "faster-whisper>=1.1.1; sys_platform != 'darwin'",
    "av>=11,<19; sys_platform != 'darwin'",  # PyAV 19 dropped the open() option faster-whisper's decoder passes
    "numpy>=2.5.4",
    "sherpa-onnx>=1.13.8",
    "sherpa-onnx-core>=1.13.8",
    "soundfile>=0.14.0",
    "truststore>=0.10.5",
]

[project.optional-dependencies]
# Windows with an NVIDIA GPU: the CUDA libraries faster-whisper (CTranslate2) needs; the app adds
# them with `uv sync --extra cuda` only when it finds one.
cuda = [
    "nvidia-cublas-cu12==12.9.2.10; sys_platform == 'win32'",  # 12.9.3 has no Windows wheel
    "nvidia-cudnn-cu12>=9.28,<10; sys_platform == 'win32'",
]

[project.scripts]
hesper = "hesper.cli:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# mlx-whisper only needs torch to convert models, which we never do (saves ~0.5 GB).
override-dependencies = ["torch; sys_platform == 'never'"]
